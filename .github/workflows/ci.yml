name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a cancelled or flaky run be retried without an empty commit. Without
  # it, a main run that gets cancelled leaves main permanently red with no way
  # to re-trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on PRs only. On main, every commit's result is a
  # record worth keeping — and cancelling there is actively harmful: a cancelled
  # run reports as `failure` with zero failed steps, which is indistinguishable
  # from a real break at a glance. (It also made `gh run rerun` on main cancel
  # the attempt it was retrying, since the retry lands in this same group.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # store.ts uses node:sqlite, stable no earlier than Node 22.5
          # (see BOOTSTRAP.md / README.md).
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - run: npm ci

      - run: npm run check-types

      # The full suite, including bundle.test.ts — it rebuilds the plugin
      # bundles into a temp dir and byte-compares against the COMMITTED
      # plugin/dist (a marketplace install is a plain file copy, no build
      # step, so dist must always be committed and current). This is the
      # bundle-freshness gate: a PR that changed src/ without `npm run
      # bundle` fails here instead of forcing a rebase dance after the fact.
      - run: npm run test:run
